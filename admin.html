<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>관리자 · 마음이 자라는 교실</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">

  <header class="admin-top">
    <span class="nav-logo">🌱 관리자</span>
    <div class="admin-top-links">
      <a class="btn-ghost" href="index.html" target="_blank" rel="noopener">대문 보기</a>
      <button class="btn-ghost" id="logout">나가기</button>
    </div>
  </header>

  <main class="admin-main" id="admin" hidden>
    <div class="notice">
      <strong>💾 고친 내용은 이 기기에 바로 저장돼요.</strong>
      이 기기에서 여는 대문 페이지에도 곧바로 보여요.<br>
      다른 기기(학생·청중)에도 보이게 하려면 맨 아래 <b>배포 파일 내려받기</b>로 받은
      <code>apps.js</code>를 저장소에 올려 기존 파일을 바꿔 주세요.
    </div>

    <h2 class="admin-h">전시 중인 웹앱 <small>⠿를 끌거나 ↑↓를 눌러 순서를 바꿔요</small></h2>
    <ol class="rows" id="rows"></ol>
    <button class="btn-add" id="add">＋ 웹앱 추가</button>

    <h2 class="admin-h">관리자 암호</h2>
    <div class="pin-change">
      <input id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="새 암호 4자리" />
      <button class="btn-ghost" id="savePin">바꾸기</button>
      <span class="hint" id="pinMsg"></span>
    </div>
  </main>

  <footer class="admin-bar" id="bar" hidden>
    <span class="status" id="status">저장됨 ✓</span>
    <div class="bar-btns">
      <button class="btn-ghost" id="reset">처음 상태로</button>
      <button class="btn-main" id="export">배포 파일 내려받기</button>
    </div>
  </footer>

  <script src="apps.js"></script>
  <script src="store.js"></script>
  <script src="pin.js"></script>
  <script src="admin.js"></script>
</body>
</html>
